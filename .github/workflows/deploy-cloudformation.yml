name: Deploy IAM Role and Policy via CloudFormation

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
# not using aws access keys and secret access key instead oidc connection using
# already established oidc connection for this repo
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      #     aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      #     aws-region: us-east-1

      # - name: Configure AWS Credentials for China region audience
      #   uses: aws-actions/configure-aws-credentials@v6.3.0
      #   with:
      #     audience: sts.amazonaws.com.cn
      #     aws-region: us-east-1
      #     role-to-assume: arn:aws:iam::608782704145:role/admin-role-for-oicd

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::608782704145:role/admin-role-for-oicd
          role-session-name: MySessionName

      - name: Deploy CloudFormation stack
        run: |
          TEMPLATE_PATH=$(pwd)/scripts/iam-role-policy.yml
          echo "Deploying from: $TEMPLATE_PATH"
          aws cloudformation deploy \
            --template-file $TEMPLATE_PATH \
            --stack-name MyIamStack \
            --capabilities CAPABILITY_NAMED_IAM
