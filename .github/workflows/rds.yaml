name: Deploy IAM Role and Policy via CloudFormation

on:
  workflow_dispatch:
    inputs:
      stack-name:
        description: please enter stack name to delete
        required: false
        type: choice
        options:
          - validate
          - create
          - delete
          
permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::608782704145:role/admin-role-for-oicd
          role-session-name: MyRDSSession

      - name: Validate Template
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        if: ${{ inputs.stack-name == 'validate' }}
        run: |
          aws cloudformation validate-template \
            --template-body file://$(pwd)/scripts/rds.yaml

      - name: Deploy CloudFormation stack
        env:
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        if: ${{ inputs.stack-name == 'create' }}
        run: |

          # TEMPLATE_PATH=$(pwd)/scripts/rds.yaml
          # STACK_NAME="my-rds-stack"
          # echo "Deploying from: $TEMPLATE_PATH"
          # status=(aws cloudformation describe-stacks --stack-name "STACK_NAME" --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NOT_FOUND")
          # if [ "$status" = "ROLLBACK_COMPLETE" ]; then echo "Stack $STACK_NAME is in ROLLBACK_COMPLETE — deleting before deploy..." aws cloudformation delete-stack --stack-name "$STACK_NAME" aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME" echo "Deleted $STACK_NAME." elif [ "$status" != "NOT_FOUND" ]; then echo "Stack $STACK_NAME exists with status: $status — will attempt update via deploy." else echo "Stack $STACK_NAME not found — will create it." fi
        
          # TEMPLATE_PATH=$(pwd)/scripts/rds.yaml
          # echo "Deploying from: $TEMPLATE_PATH"
          # aws cloudformation deploy \
          #   --template-file $TEMPLATE_PATH \
          #   --stack-name my-rds-stack-01 \
          #   --capabilities CAPABILITY_NAMED_IAM \
          #   --parameter-overrides \
          #     DBUsername="$DB_USERNAME" \
          #     DBPassword="$DB_PASSWORD"

      - name: Delete stack
        if: ${{ inputs.stack-name == 'delete' }}
