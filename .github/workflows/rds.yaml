name: Deploy IAM Role and Policy via CloudFormation

on:
  workflow_dispatch:
    inputs:
      stack-name:
        description: please enter stack name to delete
        required: false
        type: choice
        options:
          - create
          - delete
          
permissions:
  id-token: write
  contents: read
  
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-region: us-east-1
          role-to-assume: arn:aws:iam::608782704145:role/admin-role-for-oicd
          role-session-name: MyRDSSession

      - name: Validate Template
        run: |
          aws cloudformation validate-template \
            --template-body file://$(pwd)/scripts/rds.yml

      - name: Deploy CloudFormation stack
        if: ${{ inputs.stack-name == 'create' }}
        run: |
          TEMPLATE_PATH=$(pwd)/scripts/rds.yml
          echo "Deploying from: $TEMPLATE_PATH"
          aws cloudformation deploy \
            --template-file $TEMPLATE_PATH \
            --stack-name my-rds-stack \
            --capabilities CAPABILITY_NAMED_IAM

      - name: Delete stack
        if: ${{ inputs.stack-name == 'delete' }}
        run: |
          aws cloudformation delete-stack --stack-name my-rds-stack
