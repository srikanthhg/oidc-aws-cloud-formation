AWSTemplateFormatVersion: '2010-09-09'
Description: Create IAM Role and attach Policy

Resources:
# creating a role
  MyRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: MyExampleRole-15-oct-2026
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action: sts:AssumeRole
      Path: /

  MyPolicy:
  # creating a policy
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: MyExamplePolicy-15-oct-2026
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:ListAllMyBuckets
              - s3:GetObject
            Resource: "*"
      Roles:
        - !Ref MyRole # attaching policy to a role

Outputs:
  RoleName:
    Value: !Ref MyRole
  PolicyName:
    Value: !Ref MyPolicy
